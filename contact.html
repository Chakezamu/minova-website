<body>
  <div class="nav-overlay" id="navOverlay"></div>

        <span></span>

      </button>

  <!-- ページヘッダー -->
  <div class="page-header">
    <h1 class="page-header__title">お問い合わせ</h1>
    <p class="page-header__subtitle">CONTACT</p>
  </div>

  <!-- お問い合わせフォーム -->
  <section class="section fade-in">
    <div class="container">
      <div class="contact-form">
        <p class="contact-form__intro">弊団体へのお問い合わせはこちらよりお願いいたします。2日以内にご返信させて頂きます。</p>

        <!--
          フォーム送信先について：
          現在は静的フォームです。
          後ほど以下のいずれかに差し替えてください：
          1. Google Forms の action URL
          2. Google Apps Script の Web App URL
          例: action="https://script.google.com/macros/s/XXXX/exec"
        -->
        <form id="contactForm" action="#" method="POST">
          <!-- お名前 -->
          <div class="form-group">
            <label for="name">お名前<span class="required">必須</span></label>
            <input type="text" id="name" name="name" required>
          </div>

          <!-- 団体名 -->
          <div class="form-group">
            <label for="organization">団体名</label>
            <input type="text" id="organization" name="organization">
          </div>

          <!-- メールアドレス -->
          <div class="form-group">
            <label for="email">メールアドレス<span class="required">必須</span></label>
            <input type="email" id="email" name="email" required>
          </div>

          <!-- 電話番号 -->
          <div class="form-group">
            <label for="phone">電話番号</label>
            <input type="tel" id="phone" name="phone">
          </div>

          <!-- お問い合わせ内容 -->
          <div class="form-group">
            <label for="message">お問い合わせ内容<span class="required">必須</span></label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <!-- プライバシーポリシー同意 -->
          <div class="form-checkbox">
            <input type="checkbox" id="privacy" name="privacy" required>
            <label for="privacy">プライバシーポリシーに同意する<span class="required">必須</span></label>
          </div>

          <!-- 注意書き -->
          <p class="form-note">入力確認画面や自動送信メールはございません。<br>ご入力内容を確認の上、送信ボタンを押して下さい。</p>

          <!-- 送信ボタン -->
          <button type="submit" class="form-submit" id="submitBtn">送信</button>
        </form>
      </div>
    </div>
  </section>
